<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>CA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    background: #0a0a0a;
    color: #d4d4d4;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    line-height: 1.7;
    min-height: 100vh;
  }

  .hero {
    position: relative;
    max-width: 500px;
    margin: 0 auto;
    padding: 40px 20px 20px;
    text-align: center;
  }

  .hero img {
    width: 100%;
    height: auto;
    border-radius: 4px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }

  .hero h1 {
    font-family: 'Space Mono', monospace;
    color: #4ade80;
    font-size: 2rem;
    margin-top: 24px;
    letter-spacing: 6px;
    text-transform: uppercase;
  }

  @media (min-width: 768px) {
    .hero h1 { font-size: 2.5rem; }
  }

  .tracklist {
    max-width: 640px;
    margin: 0 auto;
    padding: 30px 20px 80px;
  }

  .track {
    border-bottom: 1px solid #1a1a1a;
  }

  .track-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 0;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    transition: color 0.2s;
    -webkit-tap-highlight-color: transparent;
  }

  .track-header:hover,
  .track-header:focus-visible {
    color: #4ade80;
    outline: none;
  }

  .track-header.active {
    color: #4ade80;
    position: -webkit-sticky;
    position: sticky;
    top: 0;
    background: #0a0a0a;
    z-index: 10;
    padding: 16px 0;
    box-shadow: 0 2px 12px rgba(0,0,0,0.5);
  }

  .track-number {
    font-family: 'Space Mono', monospace;
    color: #525252;
    font-size: 0.8rem;
    min-width: 28px;
    flex-shrink: 0;
  }

  .track-title {
    flex: 1;
    font-weight: 600;
    font-size: 1.15rem;
    padding: 0 12px;
    min-width: 0;
  }

  .track-arrow {
    font-size: 0.7rem;
    color: #525252;
    transition: transform 0.3s;
    flex-shrink: 0;
  }

  .track-header.active .track-arrow {
    transform: rotate(180deg);
    color: #4ade80;
  }

  .lyrics {
    display: none;
    padding: 0 0 0 28px;
  }

  .lyrics.open {
    display: block;
    padding-bottom: 20px;
  }

  .lyrics p {
    font-family: 'Space Mono', monospace;
    font-size: 0.92rem;
    line-height: 1.9;
    color: #a3a3a3;
    white-space: pre-line;
    word-break: break-word;
    overflow-wrap: break-word;
  }

  footer {
    text-align: center;
    padding: 30px 20px;
    color: #333;
    font-size: 0.75rem;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  @media (min-width: 768px) {
    .hero { padding: 60px 20px 30px; }
    .tracklist { padding: 40px 20px 100px; }
  }
</style>
</head>

const tracklist = document.getElementById('tracklist');

songs.forEach((song, i) => {
  const track = document.createElement('div');
  track.className = 'track';
  track.innerHTML = `
    <div class="track-header" role="button" tabindex="0" aria-expanded="false" onclick="toggle(this)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggle(this)}">
      <span class="track-number">${String(i + 1).padStart(2, '0')}</span>
      <span class="track-title">${song.title}</span>
      <span class="track-arrow" aria-hidden="true">▼</span>
    </div>
    <div class="lyrics">
      <p>${song.lyrics}</p>
    </div>
  `;
  tracklist.appendChild(track);
});

function toggle(header) {
  const lyrics = header.nextElementSibling;
  const isOpen = lyrics.classList.contains('open');

  if (isOpen) {
    const track = header.parentElement;
    lyrics.classList.remove('open');
    header.classList.remove('active');
    header.setAttribute('aria-expanded', 'false');
    window.scrollTo(0, track.offsetTop);
    return;
  }

  document.querySelectorAll('.lyrics.open').forEach(el => {
    el.classList.remove('open');
    const h = el.previousElementSibling;
    h.classList.remove('active');
    h.setAttribute('aria-expanded', 'false');
  });

  lyrics.classList.add('open');
  header.classList.add('active');
  header.setAttribute('aria-expanded', 'true');
  header.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
